# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   brew install postgresql
# On Ubuntu or Debian:
#   sudo apt-get install libpq-dev
#
# Configure Using Gemfile
#   gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  host: 127.0.0.1
  port: 5432
  username: postgres
  password: "000000"
  pool: 5

development:
  <<: *default
  database: taller_mecanico_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: taller_mecanico_test

production:
  primary:
    <<: *default
    database: taller_mecanico_production
    username: postgres
    password: postgres
  cache:
    <<: *default
    database: taller_mecanico_production_cache
    username: postgres
    password: postgres
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: taller_mecanico_production_queue
    username: postgres
    password: postgres
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: taller_mecanico_production_cable
    username: postgres
    password: postgres
    migrations_paths: db/cable_migrate
